# Apply SQL migrations to the App Platform managed Postgres for this app.
#
# Secrets live on the GitHub Environment named after the App Platform app id
# (currently 72bf7269-89cb-4719-ab44-548b972de291), not only at repo level.
# Required environment secret: DATABASE_URL
name: migrate

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "scripts/migrate.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    # App Platform app id — Environment holds DATABASE_URL for that app's managed db.
    environment: 72bf7269-89cb-4719-ab44-548b972de291
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run migrations
        env:
          # From Environment secrets (not repo-level).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # migrate.js strips sslmode=require and uses rejectUnauthorized:false
          # for DO managed Postgres (same approach as the API). Do not set
          # PGSSL=disable here — that is for local Make/Docker only.
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Secret DATABASE_URL is missing on Environment 72bf7269-89cb-4719-ab44-548b972de291."
            echo "Settings → Environments → (app id) → Environment secrets → DATABASE_URL"
            exit 1
          fi
          npm run migrate
