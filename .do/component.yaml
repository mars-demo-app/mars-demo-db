# App Platform fragment owned by mars-demo-db.
# Owns managed Postgres (`databases`) and the PRE_DEPLOY migrate job.
# Composed into mars-demo-app by scripts/compose-app-spec.mjs.
databases:
  # Dev managed Postgres attached to the app (customer-like App Platform pattern).
  - name: db
    engine: PG
    version: "16"
    production: false
jobs:
  - name: db-migrate
    kind: PRE_DEPLOY
    github:
      repo: mars-demo-app/mars-demo-db
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npm run migrate
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
